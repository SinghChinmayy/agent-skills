<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Git history of the My purchases feature: a red test commit then its green feat commit for listing purchases newest first, another red and green pair for paging like the catalogue, then a refactor that shares the page size cap.">
  <defs>
    <filter id="w" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/></marker>
    <style>
      text{font-family:'Comic Neue','Chalkboard SE','Comic Sans MS','Marker Felt',cursive;fill:#2b2b2b}
      .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
      .s{stroke:#2b2b2b;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="800" height="420" rx="18" fill="#fffdf7"/>
  <g filter="url(#w)">
    <path d="M80 80 L80 360" class="s" stroke-width="3"/>
    <circle cx="80" cy="92" r="13" style="fill:#ffd6d7" class="s" stroke="#e5484d" stroke-width="3"/>
    <circle cx="80" cy="156" r="13" style="fill:#d3f3e1" class="s" stroke="#30a46c" stroke-width="3"/>
    <circle cx="80" cy="220" r="13" style="fill:#ffd6d7" class="s" stroke="#e5484d" stroke-width="3"/>
    <circle cx="80" cy="284" r="13" style="fill:#d3f3e1" class="s" stroke="#30a46c" stroke-width="3"/>
    <circle cx="80" cy="348" r="13" style="fill:#dbe7ff" class="s" stroke="#276ef1" stroke-width="3"/>
  </g>
  <text x="400" y="40" font-size="17" text-anchor="middle" font-weight="700" style="fill:#2b2b2b">What the history looks like (real commits, oldest first)</text>
  <text x="108" y="88" font-size="13" text-anchor="start" class="mono" style="fill:#5b6573">2605573</text>
  <text x="108" y="108" font-size="13.5" text-anchor="start" class="mono" style="fill:#e5484d">test: my purchases lists the caller's purchases newest first (red)</text>
  <text x="108" y="152" font-size="13" text-anchor="start" class="mono" style="fill:#5b6573">a8df293</text>
  <text x="108" y="172" font-size="13.5" text-anchor="start" class="mono" style="fill:#1f7a4f">feat: my purchases lists the caller's purchases newest first</text>
  <text x="108" y="216" font-size="13" text-anchor="start" class="mono" style="fill:#5b6573">1d5130c</text>
  <text x="108" y="236" font-size="13.5" text-anchor="start" class="mono" style="fill:#e5484d">test: my purchases pages like the catalogue (red)</text>
  <text x="108" y="280" font-size="13" text-anchor="start" class="mono" style="fill:#5b6573">8defd7b</text>
  <text x="108" y="300" font-size="13.5" text-anchor="start" class="mono" style="fill:#1f7a4f">feat: my purchases pages like the catalogue</text>
  <text x="108" y="344" font-size="13" text-anchor="start" class="mono" style="fill:#5b6573">b747289</text>
  <text x="108" y="364" font-size="13.5" text-anchor="start" class="mono" style="fill:#276ef1">refactor: share the page size cap between listings and purchases</text>
  <text x="400" y="400" font-size="14" text-anchor="middle" style="fill:#5b6573">Rebase-only merges keep every one of these on main. A squash would hide the red.</text>
</svg>

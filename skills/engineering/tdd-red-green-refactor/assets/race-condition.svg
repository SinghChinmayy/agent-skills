<text x="442" y="270" font-size="12.5" class="mono">UPDATE vehicle_listings</text>
<text x="442" y="288" font-size="12.5" class="mono">SET quantity = quantity - 1</text>
<text x="442" y="306" font-size="12.5" class="mono">WHERE id = :id AND quantity &gt; 0</text>
<text x="442" y="324" font-size="12.5" class="mono">RETURNING ...</text>
<text x="596" y="370" font-size="15" text-anchor="middle">5 keys, 15 polite 409s, stock 0</text>
<text x="596" y="408" font-size="15" text-anchor="middle" style="fill:#30a46c">test: GREEN</text>

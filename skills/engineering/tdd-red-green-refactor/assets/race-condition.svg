<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Two-panel comic. Left, naive code that reads, subtracts and writes: twenty buyers all get a key for five cars, the counter says sold 20 with stock 5, and the dealer panics. Right, one atomic UPDATE with WHERE quantity greater than zero: exactly five buyers get keys, fifteen get a polite 409, and stock ends at 0.">
  <defs>
    <filter id="w" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
    <symbol id="p" viewBox="0 0 24 44">
      <circle cx="12" cy="8" r="6" style="fill:#ffe3c4" class="t"/>
      <path d="M12 14 L12 30 M12 30 L6 42 M12 30 L18 42 M12 19 L4 26 M12 19 L20 24" class="t"/>
    </symbol>
    <symbol id="key" viewBox="0 0 16 16">
      <circle cx="5" cy="8" r="4" style="fill:#f5c451" class="t"/>
      <path d="M9 8 L15 8 M13 8 L13 11" class="t"/>
    </symbol>
    <symbol id="car" viewBox="0 0 70 36">
      <path d="M4 26 L4 18 Q6 12 14 12 L22 4 L46 4 L56 12 Q66 13 66 20 L66 26 Z" style="fill:#bcd3ff" class="s"/>
      <path d="M25 8 L44 8 L50 13 L20 13 Z" style="fill:#fff" class="t"/>
      <circle cx="18" cy="27" r="6" style="fill:#2b2b2b"/><circle cx="52" cy="27" r="6" style="fill:#2b2b2b"/>
    </symbol>
    <style>
      text{font-family:'Comic Neue','Chalkboard SE','Comic Sans MS','Marker Felt',cursive;fill:#2b2b2b}
      .s{stroke:#2b2b2b;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .t{stroke:#2b2b2b;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="800" height="440" rx="18" fill="#fffdf7"/>
  <g filter="url(#w)">

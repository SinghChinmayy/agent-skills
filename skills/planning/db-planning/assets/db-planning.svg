  <text x="400" y="290" font-size="11" class="mono" text-anchor="middle" style="fill:#276ef1">Ref: orders.user_id &gt; users.id</text>
  <text x="626" y="84" font-size="13" class="mono" text-anchor="start" font-weight="700" style="fill:#2b2b2b">planning/db/</text>

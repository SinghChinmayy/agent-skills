<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Sketch: a robot with a clipboard asks question 2.2, does one user have many orders, recommending yes, one to many. An arrow leads to a whiteboard with three DBML-style tables, users, orders and items, joined by one-to-many lines and the line Ref: orders.user_id greater than users.id. Another arrow leads to a folder tree: planning/db/v0 holds stage-1.dbml, stage-1.md, stage-1.1.dbml and stage-2.dbml, and v1 is for the next session. Pills mark stage 1, the interview, and stage 2, the versioned DBML and Markdown plan.">
